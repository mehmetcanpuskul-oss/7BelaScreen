<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
 --bg:#07111f;--bg2:#0c1830;--card:#101e34;--card2:#142640;--text:#f5f8ff;
 --mut:#93a5bf;--line:#243756;--blue:#5b8cff;--cyan:#48d7e8;--gold:#ffc857;
 --green:#32d583;--red:#ff5d73;--purple:#a978ff;--shadow:0 16px 40px rgba(0,0,0,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom));background:
 radial-gradient(circle at 85% -10%,rgba(91,140,255,.25),transparent 34rem),
 radial-gradient(circle at -10% 35%,rgba(72,215,232,.12),transparent 28rem),var(--bg)}
button,input{font:inherit}
button{border:0;color:inherit;cursor:pointer}
#app{max-width:520px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 20px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}
.brand{font-weight:900;letter-spacing:-1px;font-size:24px}.brand i{font-style:normal;color:var(--cyan)}
.top-actions{display:flex;gap:8px}.circle{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.hero{border:1px solid #2c4770;background:linear-gradient(135deg,#142c52,#0e1d35 62%,#10172b);border-radius:28px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-65px;top:-70px;background:rgba(72,215,232,.14)}
.hero h1{font-size:30px;line-height:1.03;margin:0 0 8px;max-width:330px;letter-spacing:-1.2px}.hero p{color:#b8c7db;margin:0 0 18px;max-width:340px;line-height:1.45}
.level{display:flex;align-items:center;gap:10px}.levelbar{height:8px;flex:1;background:#263958;border-radius:10px;overflow:hidden}.levelbar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:17px;padding:12px;text-align:center}.stat b{font-size:19px}.stat small{display:block;color:var(--mut);margin-top:3px}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:23px 2px 11px}.section-title h2{font-size:18px;margin:0}.section-title small{color:var(--mut)}
.feature{display:flex;gap:13px;align-items:center;background:linear-gradient(135deg,#203a68,#152a4b);border:1px solid #355585;border-radius:22px;padding:15px;margin-bottom:10px;box-shadow:0 10px 25px rgba(0,0,0,.15)}.feature .ico{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue));font-size:27px;flex:none}.feature h3{margin:0 0 4px;font-size:17px}.feature p{margin:0;color:#afc0d7;font-size:12px;line-height:1.35}.go{margin-left:auto;background:#fff;color:#10203a;border-radius:13px;padding:10px 12px;font-weight:800}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}.game{min-height:120px;padding:16px;border-radius:21px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.12)}.game .gicon{font-size:27px}.game b{display:block;margin-top:9px}.game small{color:var(--mut);display:block;margin-top:4px;line-height:1.3}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(6,12,23,.9);backdrop-filter:blur(20px);border-top:1px solid var(--line)}.navin{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{background:transparent;color:#71839e;padding:6px 0;font-size:10px}.nav button.on{color:#fff}.nav .ni{display:block;font-size:21px;line-height:22px;margin-bottom:3px}
.screen-head{display:flex;align-items:center;gap:10px;margin-bottom:15px}.back{background:rgba(255,255,255,.07);border:1px solid var(--line);width:38px;height:38px;border-radius:12px}.screen-head h2{margin:0;font-size:22px}
.video-wrap{border-radius:24px;overflow:hidden;border:1px solid #30466b;background:#000;box-shadow:var(--shadow)}.video-wrap iframe{width:100%;aspect-ratio:16/9;display:block;border:0}.vmeta{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#0d192c}.pill{font-size:11px;padding:6px 9px;border-radius:10px;background:#213654;color:#bcd0ed}.xp{color:var(--gold);font-weight:800}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin-top:12px}.qcard h3{font-size:18px;line-height:1.35;margin:0 0 13px}.answers{display:grid;gap:9px}.ans{padding:14px;text-align:left;border:1px solid var(--line);background:#13233b;border-radius:15px}.ans:active{transform:scale(.99)}.ans.correct{border-color:var(--green);background:rgba(50,213,131,.13)}.ans.wrong{border-color:var(--red);background:rgba(255,93,115,.12)}
.explain{display:none;margin-top:13px;padding:12px;border-radius:14px;background:#0b1628;color:#b8c7db;font-size:13px;line-height:1.45}.explain.show{display:block}.next{display:none;margin-top:10px;width:100%;padding:14px;border-radius:15px;background:linear-gradient(90deg,var(--blue),var(--purple));font-weight:800}.next.show{display:block}
.filter{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:12px}.filter button{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--mut)}.filter button.on{background:var(--blue);border-color:var(--blue);color:white}
.wordcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:9px}.wordtop{display:flex;justify-content:space-between;align-items:center}.word{font-size:23px;font-weight:850}.lev{font-size:11px;background:#253756;border-radius:9px;padding:5px 8px}.meaning{color:var(--cyan);margin:4px 0 9px}.example{color:#aebed4;font-size:13px;line-height:1.4}.tur{color:#7186a4;font-size:12px;margin-top:5px}
.search{width:100%;padding:13px 14px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:white;outline:none;margin-bottom:10px}
.quizbox{background:linear-gradient(135deg,#171f45,#111a31);border:1px solid #384b83;border-radius:24px;padding:20px;text-align:center}.quizword{font-size:34px;font-weight:900;color:white;margin:14px 0}.quizopts{display:grid;gap:9px;margin-top:18px}.quizopts button{padding:14px;border-radius:15px;background:#182a47;border:1px solid var(--line);text-align:left}.quizopts button.ok{background:rgba(50,213,131,.14);border-color:var(--green)}.quizopts button.no{background:rgba(255,93,115,.12);border-color:var(--red)}
.gamebig{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}.gamebig h3{margin-top:0}.input{width:100%;padding:14px;border-radius:14px;background:#0b1729;color:white;border:1px solid var(--line);font-size:17px}.primary{width:100%;padding:14px;border-radius:15px;background:linear-gradient(90deg,var(--blue),var(--purple));font-weight:800;margin-top:10px}
.profile{display:grid;gap:10px}.profile .row{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px}.row small{color:var(--mut)}.badge{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.badge.lock{opacity:.42}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#f4f7ff;color:#07111f;padding:11px 16px;border-radius:16px;font-weight:800;z-index:50;box-shadow:var(--shadow)}
@media(max-width:360px){#app{padding-left:12px;padding-right:12px}.hero h1{font-size:27px}}
</style>

<script>
const ALL=[["a","(herhangi) bir, belirli bir tür veya nitelikteki","I need a book. She is an artist.","Bir kitaba ihtiyacım var. O bir sanatçı.","A1"],["abandon","bırakmak, terk etmek","The project was abandoned due to lack of funds.","Proje, fon eksikliği nedeniyle terk edildi.","B2"],["ability","yetenek, beceri, yeterlik","The job needs technical ability.","İşin teknik beceriye ihtiyacı var.","A2"],["able","yetenekli, hünerli, beceri gerektiren","She is able to speak three languages.","Üç dil konuşabiliyor.","A2"],["abolish","ortadan kaldırmak, feshetmek, bozmak","The CEO proposed to abolish unnecessary bureaucracy to improve efficiency.","CEO, verimliliği artırmak için gereksiz bürokrasinin kaldırılmasını önerdi.","B2"],["abortion","kürtaj, düşük, başarısızlık","Many organizations advocate for better healthcare access for women considering abortion.","Birçok kuruluş kürtaj yaptırmayı düşünen kadınların sağlık hizmetlerine daha iyi erişimini savunmaktadır.","C1"],["about","yaklaşık","There were about 20 people at the party.","Partide yaklaşık 20 kişi vardı.","A1"],["above","yukarıda, yüksekte","The plane flew above.","Uçak yukarıda uçtu.","A1"],["abroad","yurtdışı, yurt dışına, gurbette","She studied abroad for two years.","İki yıl yurtdışında eğitim gördü.","A2"],["absence","yokluk","Her prolonged absence from work raised concerns among her colleagues.","İşe uzun süreli yokluğu meslektaşları arasında endişe yarattı.","B2"],["absent","yok, bulunamayan, devamsız","Several students were absent from class due to a flu outbreak.","Grip salgını nedeniyle birkaç öğrenci derste yoktu","B2"],["absolute","mutlak, kesin, tam","The decision was an absolute failure because it led to unexpected problems.","Karar tam bir başarısızlıktı çünkü beklenmedik sorunlara yol açtı.","C1"],["absolutely","kesinlikle","The movie was absolutely amazing.","Film kesinlikle inanılmazdı.","C1"],["absorb","emmek, çekmek, özümsemek","Plants absorb sunlight to make their food through photosynthesis.","Bitkiler fotosentez yoluyla besinlerini üretmek için güneş ışığını emerler.","B2"],["abstract","soyut, teorik, özet","The artist’s latest exhibition features abstract paintings that challenge traditional perceptions.","Sanatçının son sergisi geleneksel algılara meydan okuyan soyut resimlerden oluşuyor.","C1"],["absurd","absürd, garip","The plot of the movie was so absurd that it became unintentionally hilarious.","Filmin konusu o kadar garipti ki istemeden de olsa komik bir hal aldı.","B2"],["abundance","bolluk, bereket","The garden was filled with an abundance of colorful flowers in full bloom.","Bahçe rengârenk çiçeklerin açtığı bir bollukla doluydu.","C1"],["abuse","kötüye kullanma, suistimal etmek, istismar, istismar etmek","The organization is working to protect vulnerable individuals from abuse.","Kuruluş, savunmasız bireyleri istismardan korumak için çalışıyor.","B2"],["academic","akademik","She is pursuing an academic career in science.","Bilim alanında bir akademik kariyer yapıyor.","C1"],["academy","akademi","The military academy trains recruits in both physical and strategic skills.","Askeri akademi, acemi askerleri hem fiziksel hem de stratejik beceriler konusunda eğitmektedir.","B2"],["accelerate","hızlandırmak, hızlanmak","Technological advancements are expected to accelerate the pace of global development","Teknolojik ilerlemelerin küresel kalkınma hızını artırması bekleniyor","C1"],["accent","aksan, şive, ağız, vurgu","His strong regional accent made it challenging for others to understand him.","Güçlü bölgesel aksanı diğerlerinin onu anlamasını zorlaştırıyordu.","B2"],["accept","kabul etmek, onaylamak, almak","Will you accept my apology?","Özürümü kabul eder misin?","A2"],["acceptable","kabul edilebilir, makul","The results are within an acceptable range, so no adjustments are needed.","Sonuçlar kabul edilebilir bir aralıktadır, bu yüzden ayarlamalara gerek yok.","C1"],["acceptance","kabul","Social acceptance plays a crucial role in shaping an individual’s sense of belonging.","Sosyal kabul, bireyin aidiyet duygusunu şekillendirmede çok önemli bir rol oynar.","C1"],["access","erişim, ulaşmak","Many people lack access to clean drinking water.","Birçok insan temiz içme suyuna erişimden yoksundur.","B2"],["accessible","ulaşılabilir, erişilebilir","Online education has made quality learning accessible to people in remote areas.","Online eğitim, kaliteli öğrenimi uzak bölgelerdeki insanlar için erişilebilir hale getirmiştir.","C1"],["accident","kaza, tesadüf, beklenmedik olay","The accident caused a traﬃc jam.","Kaza, trafik sıkışıklığına neden oldu.","A2"],["accidentally","kazara, yanlışlıkla, istemeden","She accidentally deleted the important file, causing a delay in the project.","Önemli bir dosyayı yanlışlıkla silerek projenin gecikmesine neden oldu.","C2"],["accommodate","barındırmak, uyum sağlamak, yerleştirmek","The new policy was adjusted to accommodate the needs of all employees.","Yeni politika tüm çalışanların ihtiyaçlarını karşılayacak şekilde ayarlandı.","C2"],["accommodation","konaklama yeri","They are looking for accommodation near the university.","Üniversiteye yakın bir konaklama yeri arıyorlar.","C2"],["accompany","eşlik etmek, refakat etmek","A friend will accompany him on the trip to make it enjoyable.","Bir arkadaş yolculuğunu keyifli hale getirmek için seyahat sırasında ona eşlik edecek.","C1"],["accomplish","başarmak, tamamlamak, gerçekleştirmek","With dedication and hard work, she was able to accomplish her career goals.","Özveri ve sıkı çalışmayla kariyer hedeflerine ulaşmayı başardı.","C1"],["accomplishment","başarı, yetenek","Graduating from university with honors was her proudest accomplishment.","Üniversiteden onur derecesiyle mezun olmak onun en gurur duyduğu başarısıydı.","C2"],["accordance","– e göre, uygunluk, ahenk, gereğince","In accordance with the new regulations, all employees must complete a safety training program.","Yeni yönetmelikler gereğince, tüm çalışanların bir güvenlik eğitim programını tamamlaması gerekiyor.","C1"],["according to","-e göre, buna göre","According to the weather forecast, it will rain tomorrow","Hava tahminine göre, yarın yağmur yağacak.","A2"],["accordingly","(buna) uygun olarak, uygun şekilde","The weather forecast predicts heavy rain tomorrow, so we should plan our trip accordingly.","Hava tahminleri yarın şiddetli yağmur öngörüyor, bu nedenle seyahatimizi buna göre planlamalıyız.","C2"],["account","hesap","I created a new account on the social media platform yesterday.","Dün sosyal medya platformunda yeni bir hesap oluşturdum.","B2"],["accountability","sorumluluk, hesap verme, hesap verme sorumluluğu","Public oﬃcials are expected to operate with transparency and accountability in their decisionmaking.","Kamu görevlilerinin karar alma süreçlerinde şeﬀaflık ve hesap verme içinde hareket etmeleri beklenir.","C2"],["accountable","sorumlu, mesul","As adults, we are accountable for our actions and the consequences they bring.","Yetişkinler olarak, eylemlerimizden ve bunların getirdiği sonuçlardan sorumluyuz.","C2"],["accountant","muhasebeci, mali müşavir","The accountant prepared the financial statements for the end-of-year review.","Muhasebeci, yıl sonu incelemesi için mali tabloları hazırladı.","C1"],["accumulate","biriktirmek, tasarruf etmek","By saving a small amount each month, he was able to accumulate enough money for a trip abroad.","Her ay küçük bir miktar biriktirerek, yurtdışı seyahati için yeterli parayı biriktirmeyi başardı.","C1"],["accumulation","birikim","The scientist observed an unusual accumulation of sediment at the bottom of the lake.","Bilim adamı gölün dibinde alışılmadık bir tortu birikimi gözlemledi.","C2"],["accuracy","doğruluk, kesinlik, ayar","The accuracy of the financial report was questioned due to several discrepancies.","Birkaç tutarsızlık nedeniyle mali raporun doğruluğu sorgulandı.","C1"],["accurate","doğru, kesin, hatasız","The information presented in the report is accurate and highly reliable.","Rapordaki sunulan bilgiler doğrudur ve oldukça güvenilirdir.","C1"],["accurately","doğru bir şekilde, tam olarak, kesin olarak","The scientist accurately predicted the outcome of the experiment based on her hypothesis.","Bilim adamı, hipotezine dayanarak deneyin sonucunu doğru bir şekilde tahmin etti.","C1"],["accusation","suçlama","Without concrete evidence, the accusation against him seemed baseless and unfair.","Somut kanıtlar olmadan, kendisine yöneltilen suçlama temelsiz ve haksız görünüyordu.","C1"],["accuse","suçlamak, itham etmek","She accused her friend of lying after heard everything from someone else.","Başkasından herşeyi duyduktan sonra arkadaşını yalan söylemekle suçladı.","B2"],["accused","sanık,itham edilen","The lawyer argued passionately for the rights of the accused, emphasizing the lack of evidence.","Avukat, delil yetersizliğini vurgulayarak sanığın haklarını hararetle savundu.","B2"],["achieve","başarmak, elde etmek","She achieved her goal of becoming a doctor.","Doktor olma hedefini başardı.","A2"],["achievement","başarı, başarma","Winning the award was a great achievement for her.","Ödülü kazanmak onun için büyük bir başarıydı.","C2"],["acid","asit","Lemons contain citric acid, which gives them their sour taste.","Limonlar, ekşi tatlarını veren sitrik asit içerir.","B1"],["acknowledge","kabul etmek, doğrulamak, tanımak","They openly acknowledged the importance of teamwork for achieving success.","Ekip çalışmasının önemini başarıya ulaşmak için açıkça kabul ettiler.","C2"],["acquire","edinmek, satın almak, kazanmak","He acquired new skills during the course, which helped him improve himself.","Kurs sırasında yeni beceriler edindi bu da kendisini gelişmesine yardımcı oldu.","B2"],["acquisition","kazanma, edinme","Language acquisition is a complex process that involves both innate ability and environmental factors.","Dil edinimi, hem doğuştan gelen yetenekleri hem de çevresel faktörleri içeren karmaşık bir süreçtir.","C2"] am çıkarmak, çıkarım yapmak","We can infer that the suspect is cleared of her accusation based on the evidence.","Kanıtlara dayanarak şüphelinin suçlamadan aklandığı çıkarımını yapabiliriz.","B2"],["inflation","enflasyon","As you can see, high inflation can erode the purchasing power of money.","Gördüğünüz gibi, yüksek enflasyon paranın satın alma gücünü aşındırabilir.","C1"],["inflict","vermek, yüklemek, uğratmak, bırakmak","The war inflicted immense suﬀering on the civilian population, leaving many homeless and destitute.","Savaş sivil nüfusa büyük acılar yaşatmış, pek çok kişiyi evsiz ve yoksul bırakmıştır.","B2"],["influence","etki, etkilemek","The influence of social media is growing every day.","Sosyal medyanın etkisi her geçen gün artıyor.","A2"],["influential","etkili, nüfuzlu, söz sahibi, hatırlı","As an influential leader, her decisions shaped the future of the organization and inspired others to follow her vision.","Etkili bir lider olarak aldığı kararlar kurumun geleceğini şekillendirmiş ve vizyonunu takip etmeleri için diğerlerine ilham vermiştir.","C2"],["info","bilgi, haber","I applaud how she said that she ‘needs more info’ before making a decision.","Karar vermeden önce ‘daha fazla bilgiye ihtiyacı olduğunu’ söylemesini alkışlıyorum.","B1"],["inform","bilgilendirmek, haber vermek","Please inform me if there are any changes to the schedule.","Programda bir değişiklik olursa lütfen beni bilgilendirin.","A2"],["informal","resmi olmayan, gayriresmi","This is just an informal meeting, so you don’t have to dress formally.","Bu sadece gayriresmi bir toplantı, bu yüzden resmi giyinmek zorunda değilsin.","A2"],["information","bilgi, danuşma, haber","I need more information about the course.","Kurs hakkında daha fazla bilgiye ihtiyacım var.","A1"],["infrastructure","altyapı","The country’s weak infrastructure is vulnerable to severe damage in case of an earthquake.","Ülkenin zayıf altyapısı, bir deprem durumunda ciddi hasara karşı savunmasızdır.","C2"],["ingredient","malzeme, içerik, bileşen","The recipe calls for fresh ingredients and ensures the dish has the best flavor.","Tarif, taze malzemeler gerektirir, bu da yemeğin en iyi lezzette olmasını sağlar.","A2"],["inhabitant","yerli, sakin","The inhabitants of the village are tightly connected with their customs.","Köy sakinleri geleneklerine sıkı sıkıya bağlıdır.","C1"],["inherent","kendi yapısında var olan, doğasında olan","The risks are inherent in the nature of the job, which requires workers to operate in hazardous conditions.","Riskler, çalışanların tehlikeli koşullarda çalışmasını gerektiren işin doğasında vardır.","C1"],["inherit","miras yoluyla almak, miras kalmak","It’s written in the letter of will that she will inherit her grandmother’s jewelry.","Vasiyet mektubunda büyükannesinin mücevherlerini miras alacağı yazıyor.","B2"],["inhibit","yavaşlatmak, engellemek, güçleştirmek","Fear of failure can inhibit a person from taking risks in life.","Başarısızlık korkusu, kişinin hayatta risk almasını engelleyebilir.","B2"],["initial","ilk, başlangıçtaki","The initial results of the study were promising for her experiment.","Deneyi için çalışmanın ilk sonuçları umut vericiydi","A2"],["initially","başlangıçta, ilk olarak","Initially, he found the new job diﬃcult, but now he enjoys it.","Başlangıçta yeni işi zor buldu, ama şimdi seviyor.","A2"],["initiate","başlamak, başlatmak","The government plans to initiate a nationwide campaign to raise awareness about climate change.","Hükümet, iklim değişikliği konusunda farkındalığı artırmak için ülke çapında bir kampanya başlatmayı planlıyor.","C1"],["initiative","girişim, öncülük, teşebbüs","The company launched a new initiative to reduce waste.","Şirket, atıkları azaltmak için yeni bir girişim başlattı.","A2"],["inject","enjekte etmek, iğne yapmak","The nurse carefully injected the medicine into the patient’s arm, ensuring minimal discomfort.","Hemşire ilacı hastanın koluna dikkatlice enjekte ederek en az rahatsızlık vermesin ector’s report on the new building was full of safety violations.","Müfettişin yeni binayla ilgili raporu güvenlik ihlalleriyle doluydu.","A2"],["inspiration","ilham, fikir","The breathtaking scenery of the mountains served as an inspiration for her latest painting.","Dağların nefes kesen manzarası son resmi için ilham kaynağı oldu.","C2"],["inspire","ilham vermek, esinlenmek","The movie was inspired by true events, and bringing historical moments to life.","Film, tarihsel anları canlandırarak gerçek olaylardan ilham alındı.","A2"],["install","kurmak, yerleştirmek","You need to install the app on your phone to use it.","Uygulamayı kullanmak için telefonunuza yüklemeniz gerekiyor.","A2"],["installation","kurulum, montaj","Everybody was surprised that I did the installation of the computer by myself.","Bilgisayarın kurulumunu tek başıma yapmama herkes şaşırdı.","C2"],["instance","örnek, vaka, durum","This is another instance of poor customer service.","Bu, kötü müşteri hizmetlerinin başka bir örneğidir.","A2"],["instant","anlık, hemen olan, hazır","She keeps telling me that she’s the number one hater of instant noodles.","Bana sürekli hazır noodle’ın bir numaralı nefret edeni olduğunu söylüyor.","B2"],["instantly","hemen, anında","The famous actor was instantly recognised by his fans at the airport.","Ünlü oyuncu, hayranları tarafından havaalanında anında tanındı.","C1"],["instead","yerine, aksine","Let’s stay home instead of going out.","Dışarı çıkmak yerine evde kalalım.","A2"],["instinct","içgüdü, his, sezgi","The mother’s instinct told her that something wasn’t right, even though everything seemed fine on the surface.","Görünürde her şey yolunda görünse de annenin içgüdüleri ona bir şeylerin yolunda gitmediğini söylüyordu.","C1"],["institute","enstitü, kurum","The institute oﬀers courses in various fields of study for diverse learning.","Enstitü, çeşitli çalışma alanlarında farklı öğrenim için kurslar sunuyor.","A2"],["institution","kurum, kuruluş","This financial institution provides loans to small businesses.","Bu finans kurumu küçük işletmelere kredi sağlar.","A2"],["institutional","kurumsal, geleneksel","The report emphasized the need for institutional reforms to address the root causes of corruption.","Rapor, yolsuzluğun temel nedenlerini ele almak için kurumsal reformlara duyulan ihtiyacı vurguluyordu.","C2"],["instruct","emretmek, görevlendirmek, talimat vermek","The lawyer instructed her client to remain silent during the questioning process.","Avukat, müvekkiline sorgulama süreci boyunca sessiz kalması talimatını verdi.","C1"],["instruction","talimat, yönerge","Please read the instructions carefully before using the device.","Cihazı kullanmadan önce talimatları dikkatlice okuyunuz.","A2"],["instructor","eğitmen, öğretmen","The yoga instructor showed us how to perform the exercises.","Yoga eğitmeni bize hareketleri nasıl yapacağımızı gösterdi.","A2"],["instrument","enstrüman, alet, çalgı","The violin is a popular musical instrument.","Keman, popüler bir müzik entstrümanıdır.","A2"],["instrumental","etkili, araçsal","Her expertise in finance was instrumental in securing the funding needed for the project.","Finans alanındaki uzmanlığı, proje için gerekli finansmanın sağlanmasında etkili oldu.","C2"],["insu#cient","yetersiz, verimsiz, az","The funds allocated for the project were insuﬃcient to cover all the necessary expenses.","Proje için tahsis edilen fonlar gerekli tüm harcamaları karşılamak için yetersizdi.","C1"],["insult","hakaret, hakaret etmek","Deliberately insulting someone’s beliefs not only damages relationships but also reveals a lack of understanding and empathy.","Birinin inançlarına kasıtlı olarak hakaret etmek sadece ilişkilere zarar vermekle kalmaz, aynı zamanda anlayış ve empati eksikliğini de ortaya çıkarır.","B2"],["insurance","sigorta","The company provides life insurance to all employees.","Şirket, tüm çalışanlara hayat sigortası sağlıyor.","A2"],["intact","sağlam, dokunulmamış","Despite facing several obstacles during negotiations, the CEO managed to keep the company’s reputation intact.","Müzakereler sırasında çeşitli engellerle karşılaşmasına rağmen CEO, şirketin itibarını sağlam tutmayı başardı.","B2"],["intake","alım, giriş","During training, the athletes closely monitored their caloric intake to ensure optimal energy levels for performance.","Antrenman sırasında sporcular, performans için en uygun enerji seviyelerini sağlamak amacıyla kalori alımlarını yakından takip ettiler.","B2"],["integral","integral, ayrılmaz, bütünsel","Eﬀective communication is an integral part of any successful team, ensuring that all members stay informed and motivated.","Etkili iletişim her başarılı ekibin ayrılmaz bir parçasıdır ve tüm üyelerin bilgilendirilmesini ve motive olmasını sağlar.","C1"],["integrate","entegre etmek, birleştirmek","Our school principal makes eﬀorts to integrate the two departments.","Okul müdürümüz iki bölümü birleştirmek için çaba sarf ediyor.","C1"],["integrated","bütünleşmiş, entegre","Modern cities often rely on integrated transportation systems to minimize traﬃc congestion and promote environmental sustainability.","Modern şehirler, trafik sıkışıklığını en aza indirmek ve çevresel sürdürülebilirliği teşvik etmek için genellikle entegre ulaşım sistemlerine güvenir.","C1"],["integration","birleşme, entegrasyon, bütünleşme","Successful integration of immigrants into society requires mutual eﬀort from both the newcomers and the local community.","Göçmenlerin topluma başarılı bir şekilde entegrasyonu, hem yeni gelenlerin hem de yerel toplumun karşılıklı çabasını gerektirir.","C2"],["integrity","bütünlük, dürüstlük, erdemlik","As a journalist, maintaining integrity is crucial, ensuring that reports are accurate, unbiased, and fair to all parties involved.","Bir gazeteci olarak, haberlerin doğru, tarafsız ve ilgili tüm taraflar için adil olmasını sağlamak için dürüstlüğü korumak çok önemlidir.","C1"],["intellectual","entelektüel, aydın","They invited ct was a success, notably because of the team’s dedication and hard work.","Proje, özellikle ekibin özverisi ve sıkı çalışması sayesinde başarılı oldu.","B2"],["note","not, dikkat, nota","Please take notes during the lesson.","Lütfen ders sırasında not alın.","A1"],["notebook","defter, not defteri","He bought diﬀerent colored notebooks for each of them as a gift for the new year.","Her biri için yeni yıl hediyesi olarak farklı renkli defterler aldı.","A2"],["nothing","hiçbir şey, hiç","I have nothing to say.","Söyleyecek hiçbir şeyim yok.","A1"],["notice","fark etmek, duyuru","Did you notice the sign on the door?","Kapıdaki tabelayı fark ettin mi?","A2"],["notify","bildirmek, haber vermek, bilgilendirmek","The airline notified all passengers about the flight delay via email and text messages, ensuring they had suﬃcient time to rearrange their schedules.","Havayolu, uçuş gecikmesi hakkında tüm yolcuları e-posta ve kısa mesaj yoluyla bilgilendirerek programlarını yeniden düzenlemeleri için yeterli zamana sahip olmalarını sağladı.","B2"],["notion","fikir, kavram, görüş","He has a clear notion of what he wants to achieve.","Ne başarmak istediği konusunda net bir fikri var.","A2"],["notorious","adı çıkmış, kötü şöhretli, azılı","The area was notorious for its high crime rate, discouraging both tourists and locals from venturing there after dark.","Bölge yüksek suç oranıyla adı çıkmıştı ve hem turistleri hem de yerel halkı hava karardıktan sonra oraya gitmekten caydırıyordu.","C1"],["novel","roman, yeni","She is reading a fascinating novel about historical events.","Tarihi olaylar hakkında büyüleyici bir roman okuyor.","A2"],["novelist","roman yazarı, romancı","The well-known novelist in the literary world has unfortunately passed away last week.","Edebiyat dünyasının ünlü romancısı maalesef geçen hafta hayatını kaybetti.","C1"],["November","kasım ayı","They celebrate Thanksgiving in November.","Kasım ayında Şükran Günü’nü kutluyorlar.","A1"],["now","şimdi, hemen, şu anda
